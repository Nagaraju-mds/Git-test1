# PDF OCR Processor Configuration

# Tesseract Configuration
tesseract.datapath=tessdata
tesseract.language=eng
tesseract.ocrEngineMode=1

# OCR Processing
ocr.dpi=300
ocr.quality=high

# Output Configuration
output.directory=output
output.includePageBreaks=true

# Logging
logging.level=INFO
logging.file=logs/ocr-processor.log

# Performance
processing.threadPoolSize=4
processing.maxPageCacheSize=100

